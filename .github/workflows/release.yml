name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/ZenBreak/ZenBreak.csproj

      - name: Build (Release)
        run: dotnet build src/ZenBreak/ZenBreak.csproj -c Release --no-restore

      - name: Publish Single-File Executable
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          dotnet publish src/ZenBreak/ZenBreak.csproj -c Release -o publish
          Compress-Archive -Path publish/ZenBreak.exe -DestinationPath ZenBreak-win-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            publish/ZenBreak.exe
            ZenBreak-win-x64.zip
